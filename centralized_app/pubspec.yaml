name: centralized_app
description: MultiCRM centralized employee app — select company, then use that tenant's APIs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  geolocator: ^13.0.4
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
